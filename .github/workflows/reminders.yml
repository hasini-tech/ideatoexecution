# Free, reliable scheduler: pings the reminder endpoint every 15 minutes.
# Add repository secrets: APP_URL (https://your-app.vercel.app) and CRON_SECRET.
name: Send reminders
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "${{ secrets.APP_URL }}/api/cron/reminders"
